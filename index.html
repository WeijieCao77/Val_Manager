<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121c27" />
    <!-- The ground the page is drawn on, read before anything paints so a
         light page never flashes dark on its way in. Same key ui/theme.ts
         owns; this is only the first read. -->
    <script>
      try {
        var t = localStorage.getItem('valmgr.theme');
        if (t === 'light' || t === 'cream') {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'light' ? '#e6eaf0' : '#e9e1d0');
        }
      } catch (e) {}
    </script>
    <title>猪之家游戏 — 无畏契约与英雄联盟小游戏</title>
    <meta name="description" content="免费的无畏契约与英雄联盟浏览器游戏：VCT电竞经理、开瓦包、无畏契约选手生涯、破晓与噜噜卡。执教战队、体验选手生涯、收集卡牌，打开就能玩。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
