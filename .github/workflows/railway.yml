name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      # build already includes TypeScript checking and the server engine.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: |
            dist/
            dist-server/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  audit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tested-build
      # Independent machines isolate databases, ports and filesystem fixtures.
      # Every manifest entry runs in exactly one shard with its original args/env.
      - run: npm run audit:ci -- --shard ${{ matrix.shard }}/4 --report audit-results/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-timings-${{ matrix.shard }}
          path: audit-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    # A failed/cancelled build or ANY audit shard prevents deployment.
    needs: [build, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A project token uses RAILWAY_TOKEN; an account token uses RAILWAY_API_TOKEN.
    env:
      HAS_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT: ff7eb0ac-af07-4854-8d7f-420e20a48504
      RAILWAY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tested-build

      - name: Deploy
        if: env.HAS_TOKEN != ''
        env:
          TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          # A project token already knows its project; an account token does not
          # and has to be told. Try the project-token path, then the account one.
          if RAILWAY_TOKEN="$TOKEN" railway up --service val-manager --detach; then
            exit 0
          fi
          echo "::warning::project-token path failed, retrying as an account token"
          RAILWAY_API_TOKEN="$TOKEN" railway up --service val-manager \
            --project "$RAILWAY_PROJECT" --environment "$RAILWAY_ENVIRONMENT" --detach

      - name: Verify live frontend and match engine
        if: env.HAS_TOKEN != ''
        run: node scripts/verify_deployment.mjs https://www.vctgames.com
        timeout-minutes: 10

      # Without the secret this workflow used to fail on every single push and
      # mail a failure notice each time. The build above is worth running on its
      # own, so a missing token now skips the deploy instead of failing the run.
      - name: Deploy skipped
        if: env.HAS_TOKEN == ''
        run: |
          echo "::notice::RAILWAY_TOKEN is not set — build verified, deploy skipped."
          echo "Add it under Settings → Secrets and variables → Actions to deploy automatically."
